name: Backfill historical fraud news
on:
  workflow_dispatch:
    inputs:
      year:
        description: "Calendar year to discover (example 2026)"
        required: true
        default: "2026"
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive.yml'
permissions:
  contents: write
concurrency:
  group: signal-north-publication
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Discover historical Canadian fraud reports
        env:
          ARCHIVE_YEAR: ${{ inputs.year || '2026' }}
        run: python scripts/backfill_news.py
      - name: Save discovered archive and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_archive.json data/archive_status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: historical fraud news headlines [skip ci]"
            for attempt in 1 2 3 4; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase origin/main || exit 1
            done
            exit 1
          fi
