name: Validate Signal North research interface
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-and-logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install app and browser test dependencies
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Validate Python and JavaScript syntax
        run: |
          python -m compileall -q scripts tests
          node --check app.js
          node --check intel.js
          node --check workspace.js
          node --check connections.js
          node --check research.js
          node --check network.js
          node --check us.js
      - name: Execute data-integrity tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test real browser interactions
        run: |
          python tests/smoke_site.py
          python tests/smoke_us.py
