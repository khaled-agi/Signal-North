name: Backfill Canadian fraud news 2020–2023
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-2020-2023.yml'
permissions:
  contents: write
concurrency:
  group: signal-north-archive-2020-2023
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Reconcile latest existing historical archive
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Discover prior-year Canadian fraud headlines
        run: |
          ARCHIVE_YEAR=2023 python scripts/backfill_news.py
          ARCHIVE_YEAR=2022 python scripts/backfill_news.py
          ARCHIVE_YEAR=2021 python scripts/backfill_news.py
          ARCHIVE_YEAR=2020 python scripts/backfill_news.py
      - name: Save and merge archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only upload primary collected history. The frequent Pages job owns
          # article_index/review_queue/graph derived files, avoiding rebase conflicts.
          git add data/news_archive.json data/archive_status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: extend Canadian fraud article archive to 2020–2023 [skip ci]"
            for attempt in 1 2 3 4; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase origin/main || exit 1
            done
            exit 1
          fi
