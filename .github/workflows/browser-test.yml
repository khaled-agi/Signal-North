name: Browser smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'index.html'
      - '*.css'
      - 'scripts/build_intelligence_graph.py'
      - 'scripts/build_article_index.py'
      - 'scripts/build_theme_trends.py'
      - 'scripts/collect_global.py'
      - 'scripts/build_world_registry.py'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/browser-test.yml'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Build test intelligence snapshots
        run: |
          python -m pip install -r requirements.txt
          GLOBAL_SOURCES_OFFLINE=1 python scripts/collect_global.py
          python scripts/build_world_registry.py
          python scripts/build_article_index.py
          python scripts/build_story_groups.py
          python scripts/build_intelligence_graph.py
          python scripts/build_theme_trends.py
          python -m unittest discover -s tests -p 'test_logic.py'
      - name: Test actual rendered dashboard
        run: python tests/smoke_site.py
