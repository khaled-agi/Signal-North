name: Historical fraud coverage 2024-2025
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-past-years.yml'
permissions:
  contents: write
concurrency:
  group: signal-north-archive-2024-2025
  cancel-in-progress: false
jobs:
  archive-past-years:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Search 2025 and 2024 month by month
        run: |
          ARCHIVE_YEAR=2025 python scripts/backfill_news.py
          ARCHIVE_YEAR=2024 python scripts/backfill_news.py
      - name: Rebuild unified index
        run: python scripts/build_article_index.py
      - name: Save cumulative metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_archive.json data/archive_status.json data/article_index.json
          if ! git diff --cached --quiet; then
            git commit -m "data: archive Canadian fraud reporting for 2024–2025 [skip ci]"
            for retry in 1 2 3 4; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase origin/main || exit 1
            done
            exit 1
          fi
