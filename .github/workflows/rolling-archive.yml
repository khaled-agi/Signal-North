name: Rolling historical scam archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rolling-archive.yml'
  schedule:
    - cron: '21 5 * * 0'
permissions:
  contents: write
concurrency:
  group: signal-north-rolling-history
  cancel-in-progress: false
jobs:
  collect-one-year:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Begin from current archive
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Rotate historical search years 2020–2026
        run: |
          YEAR=$(python -c 'from datetime import date; print(2020+date.today().isocalendar().week%7)')
          echo "Scanning $YEAR. Historical Google News coverage is incomplete and headline-only."
          ARCHIVE_YEAR=$YEAR python scripts/backfill_news.py
      - name: Commit raw discoveries only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_archive.json data/archive_status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: rotate historical fraud source discovery [skip ci]"
            for attempt in 1 2 3 4; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase origin/main || exit 1
            done
            exit 1
          fi
