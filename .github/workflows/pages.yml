name: Update intelligence and deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: signal-north-publication
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out source and stored history
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use latest source code and archived data
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate application syntax
        run: |
          python -m py_compile scripts/collect.py scripts/collect_news.py scripts/collect_sources.py scripts/build_article_index.py scripts/build_intelligence_graph.py scripts/collect_publishers.py
          node --check app.js
          node --check intel.js
          node --check workspace.js
          node --check connections.js
          node --check research.js
          python -m unittest discover -s tests -p 'test_logic.py'
      - name: Collect regulator publications
        env:
          TRACKER_USER_AGENT: "SignalNorthPublicResearch/0.1 (+https://github.com/khaled-agi/Signal-North)"
        run: python scripts/collect.py
      - name: Discover Canadian fraud news leads
        continue-on-error: true
        run: python scripts/collect_news.py
      - name: Discover RCMP and GDELT fraud coverage
        continue-on-error: true
        run: python scripts/collect_sources.py
      - name: Discover Canadian publisher fraud articles
        continue-on-error: true
        run: python scripts/collect_publishers.py
      - name: Assemble deduplicated source-linked article archive
        run: python scripts/build_article_index.py
      - name: Build institution evidence connections and review inbox
        run: python scripts/build_intelligence_graph.py
      - name: Commit public history and run status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/status.json data/news.json data/news_status.json data/article_index.json data/institution_intelligence.json data/review_queue.json
          if [ -f data/publisher_news.json ]; then git add data/publisher_news.json; fi
          if [ -f data/publisher_source_status.json ]; then git add data/publisher_source_status.json; fi
          if [ -f data/external_source_status.json ]; then git add data/external_source_status.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh regulator-sourced events [skip ci]"
            uploaded=false
            for attempt in 1 2 3 4; do
              if git push; then uploaded=true; break; fi
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::warning::Collection history changed concurrently. Deployment will use its freshly built snapshot; next scan will retry persistence."
                break
              fi
            done
            if [ "$uploaded" != "true" ]; then
              echo "::warning::Latest data could not be committed back to main. Inspect collector logs."
            fi
          fi
      - name: Assemble cache-busted static website
        run: |
          mkdir -p _site/data
          cp index.html styles.css light.css editorial.css connections.css research.css app.js intel.js workspace.js connections.js research.js .nojekyll _site/
          cp data/events.json data/status.json data/news.json data/news_status.json data/fraud_stats.json data/bank_disclosures.json data/incidents.json _site/data/
          if [ -f data/news_archive.json ]; then cp data/news_archive.json _site/data/; fi
          if [ -f data/archive_status.json ]; then cp data/archive_status.json _site/data/; fi
          if [ -f data/article_index.json ]; then cp data/article_index.json _site/data/; fi
          if [ -f data/external_source_status.json ]; then cp data/external_source_status.json _site/data/; fi
          if [ -f data/publisher_source_status.json ]; then cp data/publisher_source_status.json _site/data/; fi
          cp data/institution_intelligence.json data/review_queue.json _site/data/
          cp data/research_library.json _site/data/
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g" _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
