name: Update intelligence and deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: signal-north-publication
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out source and stored history
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate application syntax
        run: |
          python -m py_compile scripts/collect.py scripts/collect_news.py
          node --check app.js
          node --check intel.js
          node --check workspace.js
      - name: Collect regulator publications
        env:
          TRACKER_USER_AGENT: "SignalNorthPublicResearch/0.1 (+https://github.com/khaled-agi/Signal-North)"
        run: python scripts/collect.py
      - name: Discover Canadian fraud news leads
        continue-on-error: true
        run: python scripts/collect_news.py
      - name: Commit public history and run status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/status.json data/news.json data/news_status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh regulator-sourced events [skip ci]"
            if ! git push; then
              echo "::warning::Another commit changed main during collection. Proceeding with the freshly collected deployment snapshot; a later run will reconcile persisted history."
            fi
          fi
      - name: Assemble cache-busted static website
        run: |
          mkdir -p _site/data
          cp index.html styles.css light.css app.js intel.js workspace.js .nojekyll _site/
          cp data/events.json data/status.json data/news.json data/news_status.json data/fraud_stats.json data/bank_disclosures.json data/incidents.json _site/data/
          if [ -f data/news_archive.json ]; then cp data/news_archive.json _site/data/; fi
          if [ -f data/archive_status.json ]; then cp data/archive_status.json _site/data/; fi
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g" _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
